apiVersion: apps/v1
kind: Deployment
metadata:
  name: print-job-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: print-job-service
  template:
    metadata:
      labels:
        app: print-job-service
    spec:
      containers:
        - name: print-job-service
          image: print-job-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: printservice
            - name: DB_USER
              value: printservice
            - name: DB_PASSWORD
              value: printservice