spring.datasource.url=jdbc:h2:mem:printservice;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

jobs.worker.poll-delay-ms=500
jobs.worker.max-attempts=3
jobs.worker.threads=4
jobs.worker.processing-timeout=10m
jobs.worker.retry-backoff=10m

metrics.cache.type=memory
spring.data.redis.repositories.enabled=false
