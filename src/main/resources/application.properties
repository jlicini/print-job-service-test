spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printservice}
spring.datasource.username=${DB_USER:printservice}
spring.datasource.password=${DB_PASSWORD:printservice}

spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

jobs.worker.poll-delay-ms=500
jobs.worker.max-attempts=3
jobs.worker.threads=4
jobs.worker.processing-timeout=10m
jobs.worker.retry-backoff=10m

logging.level.com.adobe.printservice=DEBUG

metrics.cache.type=${METRICS_CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
